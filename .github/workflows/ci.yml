name: CI

on: [push, pull_request]

jobs:
  testes:
    name: Testes no Python ${{ matrix.python-version }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # O Python 3.9 saiu do Ubuntu 26.04, que e a imagem do ubuntu-latest.
          # A 24.04 ainda tem as tres versoes, entao e ela que cobre o 3.9.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest -v
